name: K90 APK Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build K90 APK
        env:
          GIT_ACTOR: ${{ github.actor }}
          GIT_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleCanary --console=plain --no-daemon --max-workers=2
      - name: Record APK hashes
        run: |
          find app/build/outputs/apk/canary -type f -name '*.apk' -exec sha256sum {} + | tee apk-sha256.txt
          cat apk-sha256.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-K90-${{ github.sha }}
          path: |
            app/build/outputs/apk/canary/*.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
